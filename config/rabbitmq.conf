# rabbitmq.conf — edit here, commit, push. GitHub Actions will restart the container.

# ─── NETWORKING ───────────────────────────────────────────────────────────────
listeners.tcp.default = 5672
management.tcp.port   = 15672

# Detect dead connections within 60 s so unacked messages are requeued promptly.
# Services implement their own reconnect loop (see platform CLAUDE.md), so the
# broker just needs to notice the connection is gone and release its resources.
heartbeat = 60

# ─── MEMORY & DISK ────────────────────────────────────────────────────────────
# Trigger flow control when RAM usage exceeds 40% of available memory
vm_memory_high_watermark.relative = 0.4

# Trigger flow control when free disk space drops below 1GB
disk_free_limit.absolute = 1GB

# ─── CONSUMER BEHAVIOUR ───────────────────────────────────────────────────────
# Set consumer timeout to 24 hours. Services on this platform hold messages
# unacked during infrastructure outages (DB down, external API down) and retry
# with exponential backoff indefinitely (platform CLAUDE.md convention). The
# default 30-minute timeout would force-close those channels mid-retry, which
# defeats the backpressure mechanism that prefetch(1) is meant to provide.
consumer_timeout = 86400000

# ─── DEFINITIONS ──────────────────────────────────────────────────────────────
# Load exchanges from definitions.json on every boot.
load_definitions = /etc/rabbitmq/definitions.json

# ─── LOGGING ──────────────────────────────────────────────────────────────────
log.console       = true
log.console.level = info
